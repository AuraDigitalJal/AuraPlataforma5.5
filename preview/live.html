<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Aura Digital · Live View</title>
<style>
:root{color-scheme:light;--ink:#34302c;--linen:#f5f0e9;--brand:#877160}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--linen);color:var(--ink)}
body{display:flex;flex-direction:column;overflow:hidden}
header{height:54px;min-height:54px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#fcfaf7;border-bottom:1px solid #e9e0d6;gap:10px;z-index:3}
.logo{font-weight:800;letter-spacing:.17em;font-size:11px;white-space:nowrap}.logo small{display:block;font-weight:500;letter-spacing:.09em;font-size:8px;margin-top:2px;color:#81766b}
.state{display:flex;gap:6px;align-items:center;font-size:10px;line-height:1.2;text-align:right;color:#73685d;max-width:49%}.dot{height:7px;width:7px;border-radius:50%;background:#bbaea1;flex:none}.dot.live{background:#47855e;box-shadow:0 0 0 3px #47855e1f}.dot.offline{background:#b94c48}
main{position:relative;flex:1;min-height:0;background:white}.placeholder{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:24px;background:#f8f4ee;color:#514439;z-index:1}
.placeholder strong{font-family:Georgia,serif;font-weight:400;font-size:clamp(27px,7vw,41px);line-height:1.16}.placeholder p{font-size:13px;line-height:1.5;max-width:300px;margin:0;color:#81776b}
.spin{width:31px;height:31px;border:2px solid #d5c9bc;border-top-color:#8e7666;border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
iframe{width:100%;height:100%;border:0;display:none;background:white}iframe.ready{display:block}
footer{font-size:10px;text-align:center;padding:7px 12px calc(7px + env(safe-area-inset-bottom));background:#fcfaf7;color:#938579;border-top:1px solid #eee5d9}
@media(min-width:650px){main{display:flex;justify-content:center;align-items:stretch;background:#eee7de}iframe{max-width:470px;box-shadow:0 0 25px #00000012}.placeholder{left:50%;right:auto;transform:translateX(-50%);max-width:470px;width:100%}}
</style>
</head>
<body>
<header><div class="logo">AURA DIGITAL<small>LIVE VIEW · VISTA DEL CLIENTE</small></div><div class="state"><span id="dot" class="dot"></span><span id="status" aria-live="polite">Conectando…</span></div></header>
<main><div class="placeholder" id="placeholder"><div class="spin" id="spin"></div><strong id="heading">Tu invitación cobra vida.</strong><p id="description">En cuanto el diseñador comparta la primera actualización, verás aquí la invitación.</p></div><iframe id="invitation" title="Invitación en vivo" referrerpolicy="no-referrer" allow="autoplay; fullscreen"></iframe></main>
<footer>Vista de trabajo · Los cambios aparecerán automáticamente</footer>
<script>
(function(){
'use strict';
var topic=decodeURIComponent((location.hash||'').slice(1));
var valid=/^aura-live-[a-f0-9]{40}$/.test(topic);
var status=document.getElementById('status');
var dot=document.getElementById('dot');
var frame=document.getElementById('invitation');
var placeholder=document.getElementById('placeholder');
var heading=document.getElementById('heading');
var description=document.getElementById('description');
var spin=document.getElementById('spin');
var bestSeq=0;
var pending=null;
var renderTimer=null;
var ended=false;
var source=null;
var pollTimer=null;
var receivedOnce=false;
var audioKey='';
var audioUrl='';
var audioPending=null;
function takeMusicManifest(html) {
  var match=html.match(/<script id="aura-live-audio-manifest" type="application\/json">([\s\S]*?)<\/script>/);
  if(!match)return {html:html,manifest:null};
  var output={html:html.replace(match[0],''),manifest:null};
  try {
    var obj=JSON.parse(match[1]);
    if(obj.version===1&&Array.isArray(obj.urls)&&obj.urls.length>=1&&obj.urls.length<=9&&
       Number.isFinite(obj.size)&&obj.size>0&&obj.size<=12*1024*1024&&
       /^audio\/[a-z0-9.+-]+$/.test(obj.mime)&&obj.urls.every(function(url){
         return /^https:\/\/ntfy\.sh\//.test(url);
       }))output.manifest=obj;
  }catch(_){}
  return output;
}
async function rebuildAudio(manifest){
  var identity=manifest.urls.join('|');
  if(audioKey===identity&&audioUrl)return audioUrl;
  if(audioPending&&audioPending.key===identity)return audioPending.promise;
  var promise=(async function(){
    // Descarga máximo 3 partes a la vez, conservando el orden original.
    var parts=new Array(manifest.urls.length);
    var cursor=0;
    async function download(){
      while(cursor<manifest.urls.length){
        var pos=cursor++;
        var response=await fetch(manifest.urls[pos],{cache:'no-store'});
        if(!response.ok)throw new Error('No se recibió la parte '+(pos+1)+' del audio.');
        parts[pos]=await response.blob();
      }
    }
    await Promise.all(Array.from({length:Math.min(3,parts.length)},download));
    var bytes=parts.reduce(function(sum,p){return sum+p.size;},0);
    if(bytes!==manifest.size)throw new Error('El archivo de música llegó incompleto.');
    var blob=new Blob(parts,{type:manifest.mime});
    var url=URL.createObjectURL(blob);
    var before=audioUrl;
    audioKey=identity;audioUrl=url;
    // El archivo anterior ya no se usa en la próxima carga; conservarlo
    // un momento evita cortar cualquier reproducción en curso.
    if(before&&before!==url)setTimeout(function(){URL.revokeObjectURL(before);},30000);
    return url;
  })();
  audioPending={key:identity,promise:promise};
  try{return await promise;}
  finally{if(audioPending&&audioPending.promise===promise)audioPending=null;}
}
async function mountAudio(manifest,snapshot,doc){
  if(!manifest||ended)return;
  setStatus('Cargando música original…','');
  try{
    var url=await rebuildAudio(manifest);
    if(snapshot!==bestSeq||ended||frame.contentDocument!==doc)return;
    var element=doc.querySelector('audio');
    if(!element)throw new Error('No se encontró el reproductor en la invitación.');
    element.src=url;element.load();
    setStatus('En vivo · música lista (toca reproducir)','live');
  }catch(error){
    if(snapshot===bestSeq&&!ended)setStatus('Invitación visible · música no disponible','offline');
    console.warn('Aura Live View: música:',error);
  }
}
/* Reensambla imágenes multipartes de ntfy en el navegador del cliente.
   Las fotos permanecen en memoria de esta sesión y no se vuelven a bajar
   al cambiar nombres, colores, textos o el orden de las secciones. */
var imageCache=new Map();
var imagePending=new Map();
function takePhotoManifest(html){
  var match=html.match(/<script id="aura-live-photo-manifest" type="application\/json">([\s\S]*?)<\/script>/);
  if(!match)return {html:html,photos:[]};
  var result={html:html.replace(match[0],''),photos:[]};
  try{
    var data=JSON.parse(match[1]);
    if(data.version!==1||!Array.isArray(data.photos)||data.photos.length>100)throw Error('Formato incorrecto');
    for(var p of data.photos){
      if(!p||!/^__AURA_LIVE_PHOTO_\d+__$/.test(p.token)||!Array.isArray(p.urls)||!p.urls.length||p.urls.length>10||
         !p.urls.every(function(url){return typeof url==='string'&&/^https:\/\/ntfy\.sh\//.test(url);})||
         !/^image\/(jpeg|png|webp|gif)$/.test(p.mime)||!Number.isFinite(p.size)||p.size<1||p.size>8000000)throw Error('Fotografía inválida');
      result.photos.push(p);
    }
  }catch(error){throw new Error('Error en la lista de imágenes: '+error.message);}
  return result;
}
async function fetchImage(photo){
  var key=photo.urls.join('|');
  if(imageCache.has(key))return imageCache.get(key);
  if(imagePending.has(key))return imagePending.get(key);
  var loading=(async function(){
    var parts=new Array(photo.urls.length),cursor=0;
    async function download(){
      while(cursor<photo.urls.length){
        var pos=cursor++,response=await fetch(photo.urls[pos],{cache:'no-store'});
        if(!response.ok)throw new Error('Parte '+(pos+1)+' de una fotografía no disponible (HTTP '+response.status+').');
        parts[pos]=await response.blob();
      }
    }
    await Promise.all(Array.from({length:Math.min(3,parts.length)},download));
    var size=parts.reduce(function(n,p){return n+p.size;},0);
    if(size!==photo.size)throw new Error('La fotografía llegó incompleta ('+size+' de '+photo.size+' bytes).');
    var url=URL.createObjectURL(new Blob(parts,{type:photo.mime}));
    imageCache.set(key,url);
    return url;
  })();
  imagePending.set(key,loading);
  try{return await loading;}finally{imagePending.delete(key);}
}
async function hydratePhotos(html,photos){
  if(!photos.length)return html;
  var results=new Array(photos.length);
  var cursor=0;
  async function worker(){
    while(cursor<photos.length){
      var pos=cursor++,photo=photos[pos];
      setStatus('Recibiendo foto '+(pos+1)+' de '+photos.length+'…','');
      results[pos]=await fetchImage(photo);
    }
  }
  await Promise.all(Array.from({length:Math.min(3,photos.length)},worker));
  photos.forEach(function(photo,i){html=html.split(photo.token).join(results[i]);});
  return html;
}
function setStatus(message,state){status.textContent=message;dot.className='dot '+(state||'');}
function showError(title,copy){placeholder.hidden=false;placeholder.style.display='flex';spin.style.display='none';heading.textContent=title;description.textContent=copy;}
function end(){ended=true;setStatus('Sesión finalizada','offline');if(source)source.close();clearInterval(pollTimer);if(!receivedOnce)showError('Sesión finalizada.','Solicita un nuevo enlace al diseñador.');}
function accept(packet){
 if(!packet||packet.event!=='message'||ended)return;
 if(packet.message){
   try{var control=JSON.parse(packet.message);if(control.type==='aura-live-ended'){end();return;}}
   catch(_){/* Aviso de archivo de ntfy */}
 }
 var asset=packet.attachment;
 if(!asset||!/^https:\/\/ntfy\.sh\//.test(asset.url||''))return;
 var m=String(asset.name||'').match(/^aura-live-(\d+)\.html(\.gz)?$/);
 if(!m)return;
 var n=parseInt(m[1],10);
 if(n<=bestSeq)return;
 bestSeq=n;pending={url:asset.url,gzip:Boolean(m[2]),n:n};
 clearTimeout(renderTimer);renderTimer=setTimeout(render,180);
}
async function render(){
 if(!pending||ended)return;
 var item=pending;pending=null;
 setStatus(receivedOnce?'Actualizando…':'Recibiendo invitación…','');
 try{
   var response=await fetch(item.url,{cache:'no-store'});
   if(!response.ok)throw new Error('HTTP '+response.status);
   var html='';
   if(item.gzip){
     if(typeof DecompressionStream!=='function')throw new Error('El navegador necesita actualización para abrir esta vista.');
     html=await new Response(response.body.pipeThrough(new DecompressionStream('gzip'))).text();
   } else html=await response.text();
   if(ended||item.n!==bestSeq)return;
   var media=takeMusicManifest(html);
   var photos=takePhotoManifest(media.html);
   html=await hydratePhotos(photos.html,photos.photos);
   if(ended||item.n!==bestSeq)return;
   html=html.replace(/__AURA_LIVE_MUSIC_PENDING__/g,'');
   var y=0;try{if(receivedOnce)y=frame.contentWindow.scrollY||0;}catch(_){}
   frame.onload=function(){
     try{frame.contentWindow.scrollTo(0,y);}catch(_){}
     if(media.manifest)mountAudio(media.manifest,item.n,frame.contentDocument);
   };
   frame.srcdoc=html;
   frame.classList.add('ready');
   placeholder.hidden=true;placeholder.style.display='none';
   receivedOnce=true;
   setStatus(media.manifest?'En vivo · preparando música…':'En vivo · actualizado','live');
 }catch(error){if(!ended){setStatus('Error de fotografía o actualización','offline');if(!receivedOnce)showError('No se pudo cargar la invitación.',error.message);console.warn('Aura Live View:',error);}}
}
async function poll(){
 if(ended)return;
 try{
   var reply=await fetch('https://ntfy.sh/'+topic+'/json?poll=1&since=all',{cache:'no-store'});
   if(!reply.ok)return;
   var lines=(await reply.text()).split('\n');
   lines.forEach(function(row){if(!row.trim())return;try{accept(JSON.parse(row));}catch(_){}});
 }catch(_){}
}
if(!valid){setStatus('Enlace no válido','offline');showError('Enlace no válido.','Solicita a Aura Digital el enlace actual de Live View.');return;}
try{
  source=new EventSource('https://ntfy.sh/'+topic+'/sse?since=all');
  source.onopen=function(){if(!ended)setStatus(receivedOnce?'En vivo · conectado':'Esperando la primera vista…',receivedOnce?'live':'');};
  source.onmessage=function(e){try{accept(JSON.parse(e.data));}catch(_){}};
  source.onerror=function(){if(!ended){setStatus(receivedOnce?'Reconectando…':'Conectando…','');if(!pollTimer){pollTimer=setInterval(poll,10000);poll();}}};
}catch(_){pollTimer=setInterval(poll,10000);poll();}
})();
</script>
</body>
</html>
