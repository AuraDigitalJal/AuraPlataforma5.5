<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Aura Digital · Live View</title>
<style>
:root{color-scheme:light;--ink:#34302c;--linen:#f5f0e9;--brand:#877160}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100%;background:var(--linen);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
body{position:relative;overflow:hidden}
/* El visor ocupa el viewport COMPLETO; ninguna barra resta altura a la invitación. */
main{position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:white;overflow:hidden}
#invitation{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:white}
#invitation.ready{display:block}
/* Barras ligeras flotantes sobre la invitación, sin ocupar espacio del visor. */
header,footer{position:fixed;left:0;right:0;z-index:30;pointer-events:none;
  -webkit-backdrop-filter:blur(12px) saturate(120%);
  backdrop-filter:blur(12px) saturate(120%)}
header{top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
  min-height:50px;padding:calc(9px + env(safe-area-inset-top)) 15px 9px;
  background:rgba(252,250,247,.66);border-bottom:1px solid rgba(215,204,192,.38)}
.logo{font-weight:800;letter-spacing:.15em;font-size:11px;white-space:nowrap}
.logo small{display:block;font-weight:500;letter-spacing:.08em;font-size:8px;margin-top:2px;color:#625b53}
.state{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-size:10px;
  line-height:1.25;text-align:right;color:#544e48;max-width:52%}
.dot{height:7px;width:7px;border-radius:50%;background:#bbaea1;flex:none}
.dot.live{background:#47855e;box-shadow:0 0 0 3px #47855e1f}
.dot.offline{background:#b94c48}
footer{bottom:0;text-align:center;font-size:10px;line-height:1.3;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:rgba(252,250,247,.52);color:#645d55;
  border-top:1px solid rgba(215,204,192,.33)}
/* Solo se muestra antes de recibir la primera invitación. */
.placeholder{position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;gap:12px;
  padding:24px;background:#f8f4ee;color:#514439;z-index:1}
.placeholder strong{font-family:Georgia,serif;font-weight:400;font-size:clamp(27px,7vw,41px);line-height:1.16}
.placeholder p{font-size:13px;line-height:1.5;max-width:300px;margin:0;color:#81776b}
.spin{width:31px;height:31px;border:2px solid #d5c9bc;border-top-color:#8e7666;
  border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:400px){
  header{padding-right:10px;padding-left:10px;gap:5px}
  .logo{font-size:10px;letter-spacing:.12em}
  .logo small{font-size:7px}
  .state{font-size:9px}
  footer{font-size:9px}
}
</style>
</head>
<body>
<header><div class="logo">AURA DIGITAL<small>LIVE VIEW · VISTA DEL CLIENTE</small></div><div class="state"><span id="dot" class="dot"></span><span id="status" aria-live="polite">Conectando…</span></div></header>
<main><div class="placeholder" id="placeholder"><div class="spin" id="spin"></div><strong id="heading">Tu invitación cobra vida.</strong><p id="description">En cuanto el diseñador comparta la primera actualización, verás aquí la invitación.</p></div><iframe id="invitation" title="Invitación en vivo" referrerpolicy="no-referrer" allow="autoplay; fullscreen"></iframe></main>
<footer>Vista de trabajo · Los cambios aparecerán automáticamente</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/live-supabase-client.js?v=aura-live-supabase-v9r2"></script>
</body>
</html>
