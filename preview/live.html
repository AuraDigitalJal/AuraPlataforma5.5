<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Aura Digital · Live View</title>
<style>
:root{color-scheme:light;--ink:#34302c;--linen:#f5f0e9;--brand:#877160}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100%;background:var(--linen);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
body{position:relative;overflow:hidden}
/* El visor ocupa el viewport COMPLETO; ninguna barra resta altura a la invitación. */
main{position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:white;overflow:hidden}
#invitation{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:white}
#invitation.ready{display:block}
/* Los paneles se eliminan: únicamente flotan el estado y la nota.
   Ninguna barra, fondo, filtro, borde o desenfoque tapa la invitación. */
header,footer{position:fixed;left:0;right:0;z-index:30;pointer-events:none;
  background:transparent;border:0;box-shadow:none;
  -webkit-backdrop-filter:none;backdrop-filter:none}
header{top:0;display:flex;align-items:flex-start;justify-content:flex-end;
  width:100%;padding:calc(14px + env(safe-area-inset-top)) 16px 0;
  min-height:0;height:auto}
.state{display:inline-flex;align-items:center;justify-content:flex-end;gap:7px;
  font-size:11px;font-weight:600;line-height:1.3;text-align:right;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.75);
  max-width:min(270px,90vw)}
.dot{height:8px;width:8px;border-radius:50%;background:#bbaea1;flex:none;
  box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.dot.live{background:#42d27b;box-shadow:0 0 0 2px rgba(0,0,0,.4),0 0 5px rgba(66,210,123,.45)}
.dot.offline{background:#ff7676}
footer{bottom:0;padding:0 14px calc(14px + env(safe-area-inset-bottom));
  text-align:center;font-size:10px;font-weight:500;line-height:1.4;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.7)}
/* Solo se muestra antes de recibir la primera invitación. */
.placeholder{position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;gap:12px;
  padding:24px;background:#f8f4ee;color:#514439;z-index:1}
.placeholder strong{font-family:Georgia,serif;font-weight:400;font-size:clamp(27px,7vw,41px);line-height:1.16}
.placeholder p{font-size:13px;line-height:1.5;max-width:300px;margin:0;color:#81776b}
.spin{width:31px;height:31px;border:2px solid #d5c9bc;border-top-color:#8e7666;
  border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:400px){
  header{padding-right:12px;padding-left:12px}
  .state{font-size:10px}
  footer{font-size:9px;padding-right:12px;padding-left:12px}
}
</style>
</head>
<body>
<header aria-label="Estado de Live View"><div class="state"><span id="dot" class="dot" aria-hidden="true"></span><span id="status" aria-live="polite">Conectando…</span></div></header>
<main><div class="placeholder" id="placeholder"><div class="spin" id="spin"></div><strong id="heading">Tu invitación cobra vida.</strong><p id="description">En cuanto el diseñador comparta la primera actualización, verás aquí la invitación.</p></div><iframe id="invitation" title="Invitación en vivo" referrerpolicy="no-referrer" allow="autoplay; fullscreen"></iframe></main>
<footer>Vista de trabajo · Los cambios aparecerán automáticamente</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/live-delta.js?v=aura-live-supabase-v17"></script>
<script src="js/live-supabase-client.js?v=aura-live-supabase-v17"></script>
</body>
</html>
