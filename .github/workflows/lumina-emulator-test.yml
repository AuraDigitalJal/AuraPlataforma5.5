name: Probar Lúmina APK en Android emulado

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-lumina/tests/**"
      - ".github/workflows/lumina-emulator-test.yml"

permissions:
  contents: read

jobs:
  probar-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar código de prueba
        uses: actions/checkout@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Obtener APK firmada publicada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download lumina-tablet-beta-v1 --pattern 'Lumina-Studio-Tablet-beta.apk' --dir .
          test -s Lumina-Studio-Tablet-beta.apk
          file Lumina-Studio-Tablet-beta.apk

      - name: Iniciar Android 14 emulado y probar la tablet
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell wm size 1280x800
            adb shell wm density 210
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            python3 android-lumina/tests/smoke_tablet.py

      - name: Subir capturas y reporte aunque alguna prueba falle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-Android-emulador-evidencias
          path: android-lumina/test-evidence/
          if-no-files-found: warn
          retention-days: 14
