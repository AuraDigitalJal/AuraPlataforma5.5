name: Test Custom Domain

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  custom-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Start Aura locally
        run: |
          python3 -m http.server 4173 >/tmp/aura-http.log 2>&1 &
          sleep 2

      - name: Validate domain integration in browser
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});

            const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFElEQVR42mP8z8AARAwMjDAGBgYAAB0AAf8H6NAAAAAASUVORK5CYII=','base64');
            await page.setInputFiles('#sharePreviewFile',{name:'share.png',mimeType:'image/png',buffer:png});

            const result=await page.evaluate(async()=>{
              auraGithubState.user={login:'AuraDigitalJal'};
              document.querySelector('#githubRepo').value='pruebawh1';

              const publicUrl=auraPublicUrl5619('AuraDigitalJal','pruebawh1','https://AuraDigitalJal.github.io/pruebawh1/');
              const rootUrl=auraPublicUrl5619('AuraDigitalJal','AuraDigitalJal.github.io','https://AuraDigitalJal.github.io/');
              const shareBase=auraShareGithubBase5618();

              const bundle=await auraGithubBuildFiles();
              const index=bundle.files.find(f=>f.path==='index.html')?.content||'';

              return {
                publicUrl,
                rootUrl,
                shareBase,
                ogUrl:index.includes('property="og:url" content="https://auradigitaljal.com/pruebawh1/"'),
                ogImage:index.includes('property="og:image" content="https://auradigitaljal.com/pruebawh1/assets/whatsapp-preview.jpg')
              };
            });

            if(result.publicUrl!=='https://auradigitaljal.com/pruebawh1/') throw new Error('URL pública incorrecta: '+result.publicUrl);
            if(result.rootUrl!=='https://auradigitaljal.com/') throw new Error('URL raíz incorrecta: '+result.rootUrl);
            if(result.shareBase!=='https://auradigitaljal.com/pruebawh1/') throw new Error('Base Open Graph incorrecta: '+result.shareBase);
            if(!result.ogUrl) throw new Error('og:url no usa auradigitaljal.com');
            if(!result.ogImage) throw new Error('og:image no usa auradigitaljal.com');
            if(errors.length) throw new Error('Errores de página: '+errors.join(' | '));

            console.log(JSON.stringify(result,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
